# Infra de desenvolvimento do h_stock.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# O banco não está aqui: é um arquivo SQLite na raiz do projeto
# (`h_stock_dev.db`), criado por `mix ash.setup`. O que sobra para o Docker é
# a caixa de entrada dos e-mails.
#
# Porta deslocada de propósito (8028) para não colidir com o unico_caminho
# rodando na mesma máquina.

services:
  # Caixa de entrada local para os e-mails do Swoosh/SMTP em dev.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: h_stock_mailhog
    ports:
      - "1028:1025"
      - "8028:8025"
    networks:
      - h_stock_network

networks:
  h_stock_network:
    name: h_stock_network
    driver: bridge
